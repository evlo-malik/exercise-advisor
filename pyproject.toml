[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "exercise-advisor"
version = "1.0.0"
description = "Pose-based action quality assessment for barbell exercises: MediaPipe landmarks + temporal convolutional networks that flag form errors and score each rep."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Malik Evloev" }]
keywords = [
  "action-quality-assessment",
  "pose-estimation",
  "mediapipe",
  "temporal-convolutional-network",
  "fitness",
  "computer-vision",
  "pytorch",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
# Pose extraction from raw video / images (not needed to train or evaluate on cached poses).
pose = ["mediapipe>=0.10", "opencv-python>=4.8"]
# TorchVision Keypoint R-CNN fallback extractor.
torchvision = ["torchvision>=0.16", "opencv-python>=4.8"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.25", "seaborn>=0.12", "tqdm>=4.65"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.8",
  "pre-commit>=3.5",
]

[project.scripts]
exercise-advisor = "exercise_advisor.cli:main"

[project.urls]
Homepage = "https://github.com/evlo-malik/exercise-advisor"
Repository = "https://github.com/evlo-malik/exercise-advisor"
Issues = "https://github.com/evlo-malik/exercise-advisor/issues"
"Live demo" = "https://exercise-advisor-mu.vercel.app"

[tool.hatch.build.targets.wheel]
packages = ["src/exercise_advisor"]

[tool.hatch.build.targets.sdist]
include = ["src/exercise_advisor", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
# Newer ruff releases also format fenced code in Markdown; keep prose out of the formatter.
extend-exclude = ["notebooks", "web", "docs", "*.md"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "UP",            # pyupgrade
  "B",             # bugbear
  "SIM",           # simplify
  "N",             # pep8-naming
  "RUF",           # ruff-specific
]
ignore = [
  "N803", "N806", "N812",  # allow X / T style names and `functional as F` in ML code
  "RUF012",        # mutable class attributes are fine for constant tables
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
packages = ["exercise_advisor"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: tests that train a model or touch shipped checkpoints"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["exercise_advisor"]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true
